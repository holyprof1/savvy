<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Image coming soon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001d3d"/>
      <stop offset="55%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#00355f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#g)"/>

  <!-- soft ambient shapes -->
  <circle cx="660" cy="120" r="150" fill="#00D4FF" opacity="0.06"/>
  <circle cx="130" cy="500" r="190" fill="#00FF88" opacity="0.05"/>

  <!-- frame -->
  <rect x="40" y="40" width="720" height="520" rx="18"
        fill="none" stroke="#00D4FF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(400 268)">
    <rect x="-46" y="-34" width="92" height="68" rx="8"
          fill="none" stroke="#00D4FF" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="-20" cy="-10" r="9" fill="#00D4FF" opacity="0.6"/>
    <path d="M-40 22 L-10 -6 L8 12 L24 0 L40 22 Z"
          fill="#00D4FF" opacity="0.42"/>
  </g>

  <text x="400" y="372" text-anchor="middle"
        font-family="Sora, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="600" fill="#ffffff" opacity="0.82">
    Image coming soon
  </text>

  <text x="400" y="404" text-anchor="middle"
        font-family="Sora, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="400" fill="#ffffff" opacity="0.42">
    Savvy Media Africa
  </text>

  <rect x="336" y="430" width="128" height="3" rx="1.5" fill="url(#accent)" opacity="0.75"/>
</svg>
